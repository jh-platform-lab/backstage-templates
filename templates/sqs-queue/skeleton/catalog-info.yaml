apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: jh-platform-lab/${{ values.name }}
    wenia.io/template-version: ${{ values.templateVersion | dump }}
  tags:
    - infrastructure
    - terraform
    - sqs
spec:
  type: infrastructure
  lifecycle: experimental
  owner: ${{ values.owner }}
