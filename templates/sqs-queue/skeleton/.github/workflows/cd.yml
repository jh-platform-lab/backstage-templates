name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # El entorno "production" exige aprobacion antes de aplicar.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Terraform init, plan and apply
        run: |
          docker run --rm -v "$PWD/terraform:/w" -w /w \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION=us-east-1 \
            hashicorp/terraform:1.12 sh -c '
              terraform init -input=false \
                -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                -backend-config="region=us-east-1" &&
              terraform apply -input=false -auto-approve'
