apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: jh-platform-lab/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    wenia.io/template-version: ${{ values.templateVersion | dump }}
  tags:
    - ${{ values.language }}
    - ${{ values.serviceType }}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  providesApis:
    - ${{ values.name }}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-api
  description: API de ${{ values.name }}
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: openapi
  lifecycle: experimental
  owner: ${{ values.owner }}
  definition:
    $text: ./openapi.yaml
