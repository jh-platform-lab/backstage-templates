apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: java-service
  title: Microservicio Java (Spring Boot)
  description: >-
    Genera un microservicio Java (Spring Boot) listo para trabajar: repo en GitHub, registro en el catalogo de servicios y APIs, Dockerfile, CI/CD, Terraform, observabilidad y documentacion.
  tags:
    - java
    - spring-boot
    - wenia
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Datos del servicio
      required:
        - name
        - description
        - owner
        - serviceType
      properties:
        name:
          title: Nombre
          type: string
          description: Formato DNS, en minusculas, de 3 a 40 caracteres.
          pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Descripcion
          type: string
          minLength: 10
          maxLength: 200
        owner:
          title: Equipo propietario
          type: string
          description: Lista cerrada de equipos.
          enum:
            - platform-team
            - payments-team
            - growth-team
        serviceType:
          title: Tipo de servicio
          type: string
          description: Lambda con Function URL, o un servicio sobre Kubernetes.
          enum:
            - lambda
            - k8s
          enumNames:
            - AWS Lambda (imagen de contenedor)
            - Kubernetes (EKS)

    - title: APIs del servicio
      required:
        - apis
      properties:
        apis:
          title: Metodos de la API
          type: array
          minItems: 1
          maxItems: 10
          description: Cada metodo genera una ruta y su entrada en el openapi.yaml.
          items:
            type: object
            required:
              - name
              - method
              - path
            properties:
              name:
                title: Nombre de la operacion
                type: string
                pattern: '^[a-z][a-z0-9-]{1,30}$'
              method:
                title: Metodo HTTP
                type: string
                enum:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
              path:
                title: Ruta
                type: string
                description: Empieza con /. Ejemplo, /services/{id}
                pattern: '^/[a-zA-Z0-9/{}_-]*$'
                maxLength: 80

  steps:
    # 1. Duplicados: consulta el catalogo y GitHub; si el nombre existe, la tarea falla aqui.
    - id: check-duplicate
      name: Verificar que el nombre no exista
      action: wenia:check-duplicate
      input:
        name: ${{ parameters.name }}
        org: jh-platform-lab

    - id: fetch
      name: Generar los archivos
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*
          - docs/img/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          serviceType: ${{ parameters.serviceType }}
          language: java
          apis: ${{ parameters.apis }}
          templateVersion: 1.5.5

    - id: publish
      name: Crear el repositorio en GitHub
      action: publish:github
      input:
        repoUrl: github.com?owner=jh-platform-lab&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false

    # Registra el Component en el catalogo; si falla, la accion borra el repo creado por esta tarea.
    - id: register
      name: Registrar en el catalogo
      action: wenia:register-or-rollback
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        org: jh-platform-lab
        name: ${{ parameters.name }}

  output:
    links:
      - title: Repositorio
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Abrir en el catalogo
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
