name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: bandit -r app -q
      - run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t app-k8s:ci .
      - run: docker build -f Dockerfile.lambda -t app-lambda:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app-k8s:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
