name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: bandit -r app -q
      - run: pip-audit -r requirements.txt

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Terraform fmt, init and validate
        run: |
          TF="docker run --rm -v $PWD/terraform:/w -w /w hashicorp/terraform:1.12"
          $TF fmt -check -diff
          $TF init -backend=false -input=false
          $TF validate
      - name: Checkov
        run: docker run --rm -v "$PWD/terraform:/tf" bridgecrew/checkov:3.4.0 -d /tf --framework terraform --compact

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile -t app-k8s:ci .
      - run: docker build -f Dockerfile.lambda -t app-lambda:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app-k8s:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
