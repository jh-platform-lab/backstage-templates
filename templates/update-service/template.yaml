apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: update-service
  title: Actualizar servicio a la ultima version de la plantilla
  description: >-
    Abre un pull request en un servicio existente con los archivos de plataforma al dia (Terraform, Kubernetes, observabilidad, CD y catalogo). No toca el codigo de la aplicacion ni su CI.
  tags:
    - maintenance
    - wenia
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Servicio a actualizar
      required:
        - component
      properties:
        component:
          title: Servicio
          type: string
          description: Servicio del catalogo que se va a modificar.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: service

  steps:
    - id: entity
      name: Leer el servicio del catalogo
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.component }}

    - id: fetch
      name: Generar los archivos actualizados
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ steps['entity'].output.entity.metadata.name }}
          description: ${{ steps['entity'].output.entity.metadata.description }}
          owner: ${{ steps['entity'].output.entity.spec.owner | replace('group:default/', '') }}
          language: ${{ steps['entity'].output.entity.metadata.tags[0] }}
          serviceType: ${{ steps['entity'].output.entity.metadata.tags[1] }}
          templateVersion: 1.3.0

    - id: pr
      name: Abrir el pull request en el servicio
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=jh-platform-lab&repo=${{ steps['entity'].output.entity.metadata.name }}
        branchName: chore/wenia-platform-files
        title: "chore: update platform files to template version 1.3.0"
        description: |
          Actualiza los archivos de plataforma a la version 1.3.0 de la plantilla.

          Incluye: `terraform/`, `k8s/`, `observability/`, `scripts/kind-deploy.sh`, `deploy/`, `.github/workflows/cd.yml` y `catalog-info.yaml`.
          No incluye el codigo de la aplicacion, el Dockerfile ni `ci.yml`: revisalos aparte.

          Revisa el diff antes de fusionar. `terraform/terraform.tfvars` se regenera desde el catalogo.
        update: true

  output:
    links:
      - title: Pull request
        url: ${{ steps['pr'].output.remoteUrl }}
