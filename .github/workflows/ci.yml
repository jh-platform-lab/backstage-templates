name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Yamllint (template only, skeleton uses Nunjucks)
        run: |
          pip install yamllint==1.35.1
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" templates/python-service/template.yaml
